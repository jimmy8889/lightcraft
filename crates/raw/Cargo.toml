[package]
name = "lightcraft-raw"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "LightCraft RAW decoding, demosaicing and DNG colour model (L1)"

[lints]
workspace = true

[features]
default = []
pmrid = ["dep:candle-core", "dep:candle-nn", "dep:sha2", "dep:zip"]

[dependencies]
lightcraft-tiff = { workspace = true }
lightcraft-meta = { workspace = true }
lightcraft-raster = { workspace = true }
lightcraft-color = { workspace = true }
lightcraft-geom = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
rayon = { workspace = true }
miniz_oxide = { workspace = true }
zune-jpeg = { workspace = true }
zune-core = { workspace = true }

candle-core = { workspace = true, optional = true }
candle-nn = { workspace = true, optional = true }
sha2 = { version = "=0.10.9", default-features = false, optional = true }
zip = { version = "=7.2.0", default-features = false, optional = true }

[dev-dependencies]
jpeg-encoder = { workspace = true }
proptest = { workspace = true }
